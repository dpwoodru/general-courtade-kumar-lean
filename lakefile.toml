# Lake project for the General Courtade-Kumar theorem (Lean 4.33.0, Mathlib db584cd6).
#   lake exe cache get        # prebuilt Mathlib from the Mathlib cache
#   lake build                # default target FinalCheck: the final theorem and its whole import closure
#                             # (45,500 modules); fails unless the theorem has the expected type and axioms
# Same libraries and Mathlib pin as the v1.0 BUILD/lake/lakefile.toml, which was tested with
# `lake build CKRoute.Final`; see CHANGELOG.md (v1.1) for the exact changes.
name = "general-ck"
version = "0.1.0"
defaultTargets = ["FinalCheck"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

