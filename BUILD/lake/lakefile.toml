# Lake project skeleton for the v3 sources — UNTESTED on the campaign host (no-lake rule there).
# Put this file, lean-toolchain and lake-manifest.json at the root of the extracted sources/ tree, then:
#   lake exe cache get          # Mathlib db584cd6… oleans from the Mathlib cache
#   lake build CKRoute.Final    # builds the final module and its whole import closure (45,500 modules)
# Lake records the package name "general-ck" in every olean, so bytes differ from CLEAN_BUILD_HASHES.tsv
# (which follows the plain-lean recipes of BUILD/build_plain.py) by the package name only.
name = "general-ck"
version = "0.1.0"
defaultTargets = ["CKRoute"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "CKLaneA"
globs = ["CKLaneA", "CKLaneA.+"]

